name: Squad npm Publish
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (for example 0.13.1)'
        required: true
        type: string
      source_ref:
        description: 'Git ref containing the release source'
        required: false
        default: ''
        type: string
    secrets:
      NPM_TOKEN:
        description: 'npm automation token used to publish both Squad packages'
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.9.1)'
        required: true
        type: string
      source_ref:
        description: 'Git ref containing the release source (defaults to the selected ref)'
        required: false
        default: ''
        type: string

concurrency:
  group: squad-npm-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preflight:
    name: Pre-publish dependency validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
      - name: "Scan for file: references in package.json files"
        run: |
          echo "Scanning all packages/*/package.json for file: references..."
          FOUND=0
          for pkg in packages/*/package.json; do
            # Check dependencies, devDependencies, and optionalDependencies for file: refs
            MATCHES=$(node -e "
              const pkg = require('./$pkg');
              const sections = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies'];
              for (const s of sections) {
                for (const [name, ver] of Object.entries(pkg[s] || {})) {
                  if (String(ver).startsWith('file:')) {
                    console.log('  ❌ ' + s + '.' + name + ' = ' + ver);
                  }
                }
              }
            ")
            if [ -n "$MATCHES" ]; then
              echo "::error::file: dependency found in $pkg"
              echo "$pkg:"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "::error::PUBLISH BLOCKED — file: references break global installs (see v0.9.1 incident)"
            echo "Fix: Replace file: references with proper version ranges before publishing."
            exit 1
          fi
          echo "✅ No file: references found — safe to publish"
      # CI Hardening: Lockfile stability check (item 6)
      # Ensures workspace packages in package-lock.json resolve to local links,
      # not stale registry URLs. Catches lockfile drift before publish —
      # prevents v0.9.1-style incidents where stale entries break installs.
      - name: "🔒 Lockfile stability check"
        run: |
          echo "Validating package-lock.json hasn't drifted..."
          node -e "
            const fs = require('fs');
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            const pkgs = lock.packages || {};
            const stale = Object.keys(pkgs).filter(k =>
              k.includes('node_modules/@bradygaster/squad-') &&
              pkgs[k].resolved && pkgs[k].resolved.startsWith('https://')
            );
            if (stale.length) {
              console.error('::error::LOCKFILE DRIFT DETECTED — workspace packages resolve to registry URLs instead of local links.');
              stale.forEach(k => console.error('  STALE: ' + k + ' → ' + pkgs[k].resolved));
              console.error('');
              console.error('Fix: Run npm install at the repo root to regenerate the lockfile.');
              process.exit(1);
            }
            const missingIntegrity = Object.keys(pkgs).filter(k =>
              k.includes('node_modules/@bradygaster/squad-') &&
              pkgs[k].resolved && pkgs[k].resolved.startsWith('https://') &&
              (!pkgs[k].integrity || !pkgs[k].integrity.startsWith('sha512-'))
            );
            if (missingIntegrity.length) {
              console.error('::error::MISSING INTEGRITY HASHES — workspace packages resolved from registry lack sha512 hashes:');
              missingIntegrity.forEach(k => console.error('  ' + k + ' (resolved: ' + pkgs[k].resolved + ')'));
              console.error('Fix: Run npm install at the repo root to regenerate the lockfile.');
              process.exit(1);
            }
            console.log('✅ Lockfile stable — all workspace packages resolve to local links');
          "
      - name: Validate semver versions
        run: |
          echo "Validating version numbers are valid semver..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            const semverRe = /^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/;
            const pkgs = fs.readdirSync('packages', { withFileTypes: true })
              .filter(d => d.isDirectory())
              .map(d => path.join('packages', d.name, 'package.json'))
              .filter(p => fs.existsSync(p));
            let failed = false;
            for (const p of pkgs) {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (!semverRe.test(pkg.version)) {
                console.error('::error::Invalid semver in ' + p + ': ' + pkg.version);
                failed = true;
              } else {
                console.log('✅ ' + pkg.name + '@' + pkg.version);
              }
            }
            if (failed) process.exit(1);
          "
      - name: Validate workspace release dependency
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');

          const sdk = JSON.parse(readFileSync('packages/squad-sdk/package.json', 'utf8'));
          const cli = JSON.parse(readFileSync('packages/squad-cli/package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const dependency = cli.dependencies?.['@bradygaster/squad-sdk'];
          const lockDependency =
            lock.packages?.['packages/squad-cli']?.dependencies?.['@bradygaster/squad-sdk'];

          if (sdk.version !== cli.version) {
            throw new Error(`SDK ${sdk.version} and CLI ${cli.version} versions do not match.`);
          }
          if (sdk.version.includes('-')) {
            const expected = `>=${sdk.version}`;
            if (dependency !== expected || lockDependency !== expected) {
              throw new Error(
                `Preview publication requires the CLI SDK dependency and lockfile entry to be '${expected}'.`,
              );
            }
          } else if (dependency?.includes('-') || lockDependency?.includes('-')) {
            throw new Error('Stable publication cannot retain a prerelease SDK dependency floor.');
          }
          NODE
  smoke-test:
    name: CLI packaging smoke test
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: |
          success=false
          for i in 1 2 3; do
            if npm ci; then
              success=true
              break
            fi
            echo "Retry $i/3 — npm ci failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" = false ]; then
            echo "::error::npm ci failed after 3 attempts"
            exit 1
          fi
      - name: Build
        # Release tags intentionally omit contributor-only .squad sources used
        # by the root prebuild synchronization step.
        run: npm -w packages/squad-sdk run build && npm -w packages/squad-cli run build
      - name: Validate npm pack succeeds
        run: |
          echo "Verifying npm pack produces valid tarballs..."
          npm -w packages/squad-sdk pack --dry-run
          npm -w packages/squad-cli pack --dry-run
          echo "✅ Both packages pack successfully"
      - name: Run CLI smoke tests
        run: npx vitest run test/cli-packaging-smoke.test.ts
  # CI Hardening: npm registry health check (item 10)
  # Verify the npm registry is reachable before starting any publish jobs.
  # Prevents wasted CI time and partial publishes when the registry is down.
  registry-check:
    name: npm registry health check
    needs: [preflight, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: "🌐 Verify npm registry is reachable"
        run: |
          echo "Checking npm registry health before publish..."
          success=false
          for i in 1 2 3; do
            if npm ping 2>&1; then
              success=true
              break
            fi
            echo "Registry ping attempt $i/3 failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" = false ]; then
            echo "::error::npm registry is unreachable after 3 attempts — publish aborted"
            echo "::error::Check https://status.npmjs.org/ for registry status"
            exit 1
          fi
          echo "✅ npm registry is reachable"
          if ! npm view @bradygaster/squad-sdk version 2>/dev/null; then
            echo "::warning::Cannot verify @bradygaster/squad-sdk on registry — package may not exist yet or registry is degraded"
          else
            echo "✅ @bradygaster package namespace is accessible"
          fi
  publish-sdk:
    name: Publish @bradygaster/squad-sdk
    needs: [preflight, smoke-test, registry-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      stable_release: ${{ steps.version.outputs.stable_release }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Validate npm token
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured — publish will fail"
            exit 1
          fi
          echo "✅ NPM_TOKEN is set"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Determine and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "release" ]; then
            VERSION="${RELEASE_TAG}"
            VERSION="${VERSION#v}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${VERSION}" =~ ${semver_re} ]]; then
            echo "::error::Invalid npm release version '${VERSION}'; expected strict SemVer without a leading v."
            exit 1
          fi

          stable_release=false
          dist_tag=preview
          if [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            stable_release=true
            dist_tag=latest
          elif [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Unsupported prerelease '$VERSION'; expected MAJOR.MINOR.PATCH-preview.N."
            exit 1
          fi

          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"
          echo "stable_release=${stable_release}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION} on npm dist-tag '${dist_tag}'"
      - name: Install dependencies
        run: |
          success=false
          for i in 1 2 3; do
            if npm ci; then
              success=true
              break
            fi
            echo "Retry $i/3 — npm ci failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" = false ]; then
            echo "::error::npm ci failed after 3 attempts"
            exit 1
          fi
      - name: Build squad-sdk
        run: npm -w packages/squad-sdk run build
      - name: Verify package version matches target
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./packages/squad-sdk/package.json').version")
          if [[ "$PKG_VERSION" != "$TARGET_VERSION" ]]; then
            echo "::error::Package version ($PKG_VERSION) does not match target version ($TARGET_VERSION)"
            exit 1
          fi
          echo "Package version matches: $PKG_VERSION"
      - name: Publish squad-sdk to npm
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@bradygaster/squad-sdk@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@bradygaster/squad-sdk@${PACKAGE_VERSION} already exists; skipping npm publish."
            tagged_version="$(npm view @bradygaster/squad-sdk "dist-tags.${NPM_DIST_TAG}" 2>/dev/null || true)"
            if [ "$tagged_version" != "$PACKAGE_VERSION" ]; then
              echo "::error::npm dist-tag '${NPM_DIST_TAG}' points to '${tagged_version:-<unset>}', not '${PACKAGE_VERSION}'. Refusing to move it implicitly."
              exit 1
            fi
          else
            npm -w packages/squad-sdk publish --access public --provenance --tag "$NPM_DIST_TAG"
          fi
      - name: Verify npm publication
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for i in 1 2 3 4 5; do
            published_version="$(npm view "@bradygaster/squad-sdk@${PACKAGE_VERSION}" version 2>/dev/null || true)"
            tagged_version="$(npm view @bradygaster/squad-sdk "dist-tags.${NPM_DIST_TAG}" 2>/dev/null || true)"
            if [ "$published_version" = "$PACKAGE_VERSION" ] && [ "$tagged_version" = "$PACKAGE_VERSION" ]; then
              echo "Verified @bradygaster/squad-sdk@${PACKAGE_VERSION} on npm dist-tag '${NPM_DIST_TAG}'"
              exit 0
            fi
            echo "Registry attempt $i/5: version='${published_version:-<unset>}', ${NPM_DIST_TAG}='${tagged_version:-<unset>}'; waiting 15s..."
            sleep 15
          done
          echo "::error::Could not verify @bradygaster/squad-sdk@${PACKAGE_VERSION} on npm dist-tag '${NPM_DIST_TAG}' after 5 attempts."
          exit 1
  publish-cli:
    name: Publish @bradygaster/squad-cli
    needs: [preflight, smoke-test, registry-check, publish-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      stable_release: ${{ steps.version.outputs.stable_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Validate npm token
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured — publish will fail"
            exit 1
          fi
          echo "✅ NPM_TOKEN is set"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Determine and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "release" ]; then
            VERSION="${RELEASE_TAG}"
            VERSION="${VERSION#v}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${VERSION}" =~ ${semver_re} ]]; then
            echo "::error::Invalid npm release version '${VERSION}'; expected strict SemVer without a leading v."
            exit 1
          fi

          stable_release=false
          dist_tag=preview
          if [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            stable_release=true
            dist_tag=latest
          elif [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Unsupported prerelease '$VERSION'; expected MAJOR.MINOR.PATCH-preview.N."
            exit 1
          fi

          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"
          echo "stable_release=${stable_release}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION} on npm dist-tag '${dist_tag}'"
      - name: Install dependencies
        run: |
          success=false
          for i in 1 2 3; do
            if npm ci; then
              success=true
              break
            fi
            echo "Retry $i/3 — npm ci failed, retrying in 5s..."
            sleep 5
          done
          if [ "$success" = false ]; then
            echo "::error::npm ci failed after 3 attempts"
            exit 1
          fi
      - name: "Guard against file: dependencies"
        run: |
          SDK_DEP=$(node -p "require('./packages/squad-cli/package.json').dependencies['@bradygaster/squad-sdk']")
          if [[ "$SDK_DEP" == file:* ]]; then
            echo "::error::squad-cli has file: dependency on squad-sdk — this breaks global installs"
            exit 1
          fi
          echo "SDK dependency is safe: $SDK_DEP"
      - name: "Verify SDK version is resolvable on npm (#1203)"
        run: |
          # Extract the minimum version floor from the SDK dependency range
          SDK_DEP=$(node -p "require('./packages/squad-cli/package.json').dependencies['@bradygaster/squad-sdk']")
          echo "SDK dependency declared: $SDK_DEP"
          # Verify that at least one version satisfying the range exists on the registry
          if ! npm view "@bradygaster/squad-sdk" versions --json 2>/dev/null | node -e "
            const semver = require('semver');
            const range = process.argv[1];
            let data = '';
            process.stdin.on('data', c => data += c);
            process.stdin.on('end', () => {
              const versions = JSON.parse(data);
              const arr = Array.isArray(versions) ? versions : [versions];
              const match = arr.find(v => semver.satisfies(v, range));
              if (!match) {
                console.error('::error::No published SDK version satisfies ' + range);
                process.exit(1);
              }
              console.log('✅ SDK dependency resolves to: ' + match);
            });
          " "$SDK_DEP"; then
            echo "::error::Cannot verify SDK dependency is resolvable — aborting CLI publish to prevent #1203"
            exit 1
          fi
      - name: "Pin squad-sdk dependency to the exact published version (#1588)"
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Source keeps a floor range (">=x.y.z") so local workspace installs
          # still resolve the in-repo SDK. That range is unbounded upward
          # though, so a CLI version pinned by a downstream consumer silently
          # picks up whatever SDK version is newest at their install time.
          # Rewrite the published package.json to an exact pin so a given CLI
          # version always resolves the same SDK version it shipped with.
          node -e "
            const fs = require('fs');
            const path = 'packages/squad-cli/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.dependencies['@bradygaster/squad-sdk'] = '$PKG_VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Pinned @bradygaster/squad-sdk dependency to ' + '$PKG_VERSION');
          "
      - name: Build squad-sdk (required for CLI project references)
        run: npm -w packages/squad-sdk run build
      - name: Build squad-cli
        run: npm -w packages/squad-cli run build
      - name: Verify package version matches target
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./packages/squad-cli/package.json').version")
          if [[ "$PKG_VERSION" != "$TARGET_VERSION" ]]; then
            echo "::error::Package version ($PKG_VERSION) does not match target version ($TARGET_VERSION)"
            exit 1
          fi
          echo "Package version matches: $PKG_VERSION"
      - name: Publish squad-cli to npm
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@bradygaster/squad-cli@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@bradygaster/squad-cli@${PACKAGE_VERSION} already exists; skipping npm publish."
            tagged_version="$(npm view @bradygaster/squad-cli "dist-tags.${NPM_DIST_TAG}" 2>/dev/null || true)"
            if [ "$tagged_version" != "$PACKAGE_VERSION" ]; then
              echo "::error::npm dist-tag '${NPM_DIST_TAG}' points to '${tagged_version:-<unset>}', not '${PACKAGE_VERSION}'. Refusing to move it implicitly."
              exit 1
            fi
          else
            npm -w packages/squad-cli publish --access public --provenance --tag "$NPM_DIST_TAG"
          fi
      - name: Verify npm publication
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for i in 1 2 3 4 5; do
            published_version="$(npm view "@bradygaster/squad-cli@${PACKAGE_VERSION}" version 2>/dev/null || true)"
            tagged_version="$(npm view @bradygaster/squad-cli "dist-tags.${NPM_DIST_TAG}" 2>/dev/null || true)"
            if [ "$published_version" = "$PACKAGE_VERSION" ] && [ "$tagged_version" = "$PACKAGE_VERSION" ]; then
              echo "Verified @bradygaster/squad-cli@${PACKAGE_VERSION} on npm dist-tag '${NPM_DIST_TAG}'"
              exit 0
            fi
            echo "Registry attempt $i/5: version='${published_version:-<unset>}', ${NPM_DIST_TAG}='${tagged_version:-<unset>}'; waiting 15s..."
            sleep 15
          done
          echo "::error::Could not verify @bradygaster/squad-cli@${PACKAGE_VERSION} on npm dist-tag '${NPM_DIST_TAG}' after 5 attempts."
          exit 1

  # --- Issues #1491 / #1497 ---------------------------------------------
  # After a stable release publishes to `latest`, ensure each package's
  # `insider` dist-tag is not left semver-lower than `latest`. Promotions run
  # per package so a successful SDK publish can still update SDK's `insider`
  # tag even when the later CLI publish fails.
  promote-insider-tag-sdk:
    name: Promote SDK insider dist-tag if behind latest
    needs: publish-sdk
    if: needs.publish-sdk.outputs.stable_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Validate npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured; cannot promote insider dist-tag"
            exit 1
          fi
          echo "NPM_TOKEN is set"
      - name: Determine and validate version
        id: version
        env:
          # Read release-tag / dispatch inputs into env to avoid `${{ }}`
          # interpolation inside a shell script (script-injection hardening).
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            RAW="${RELEASE_TAG#v}"
          else
            RAW="$INPUT_VERSION"
          fi
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$RAW" =~ $semver_re ]]; then
            echo "::error::Invalid version format: $RAW"
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "Promotion candidate: $RAW"
      - name: Promote insider dist-tag for squad-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/promote-insider-tag.mjs @bradygaster/squad-sdk "$NEW_VERSION"
  promote-insider-tag-cli:
    name: Promote CLI insider dist-tag if behind latest
    needs: publish-cli
    if: needs.publish-cli.outputs.stable_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Validate npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured; cannot promote insider dist-tag"
            exit 1
          fi
          echo "NPM_TOKEN is set"
      - name: Determine and validate version
        id: version
        env:
          # Read release-tag / dispatch inputs into env to avoid `${{ }}`
          # interpolation inside a shell script (script-injection hardening).
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            RAW="${RELEASE_TAG#v}"
          else
            RAW="$INPUT_VERSION"
          fi
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$RAW" =~ $semver_re ]]; then
            echo "::error::Invalid version format: $RAW"
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "Promotion candidate: $RAW"
      - name: Promote insider dist-tag for squad-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/promote-insider-tag.mjs @bradygaster/squad-cli "$NEW_VERSION"
