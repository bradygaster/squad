name: Squad npm Publish

# Publishes exactly the two tarballs produced by Squad Release Verify.
#
# The workflow uses fail-closed reconciliation with idempotent partial-release
# recovery. Direct dispatch is recovery-only: it must run from the immutable
# release tag and cite a successful Squad Release Verify run plus its matching
# evidence artifact at the same SHA.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (for example 2.0.0-preview.1)'
        required: true
        type: string
      source_sha:
        description: 'Full 40-hex commit SHA targeted by the release tag'
        required: true
        type: string
      dist_tag:
        description: 'Primary npm dist-tag (insider, preview or latest)'
        required: true
        type: string
      add_preview_alias:
        description: 'Also point preview at this version after the primary tag verifies'
        required: false
        default: false
        type: boolean
      evidence_artifact:
        description: 'Exact release-evidence-<source_sha> artifact from Squad Release Verify'
        required: true
        type: string
      verify_run_id:
        description: 'Empty for the orchestrated release; required for direct recovery'
        required: false
        default: ''
        type: string
    secrets:
      NPM_TOKEN:
        description: 'npm automation token used only by registry mutation steps'
        required: true
    outputs:
      outcome:
        description: 'COMPLETE, PARTIAL_PUBLISH or UNKNOWN'
        value: ${{ jobs.publish.outputs.outcome }}
      stable_release:
        description: 'true when the version is a stable MAJOR.MINOR.PATCH'
        value: ${{ jobs.prepare.outputs.stable_release }}
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to reconcile (for example 2.0.0-preview.1)'
        required: true
        type: string
      source_sha:
        description: 'Full 40-hex commit SHA targeted by the existing release tag'
        required: true
        type: string
      dist_tag:
        description: 'Primary npm dist-tag'
        required: true
        default: insider
        type: choice
        options: [insider, preview, latest]
      add_preview_alias:
        description: 'Also point preview at this version after the primary tag verifies'
        required: false
        default: true
        type: boolean
      verify_run_id:
        description: 'Successful Squad Release Verify run ID at source_sha'
        required: true
        type: string
      evidence_artifact:
        description: 'Exact release-evidence-<source_sha> artifact from that run'
        required: true
        type: string

concurrency:
  group: squad-npm-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLIC_REGISTRY: https://registry.npmjs.org/

jobs:
  prepare:
    name: Validate tag, verification proof and exact tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      publish_artifact: ${{ steps.publish-artifact.outputs.name }}
      stable_release: ${{ steps.inputs.outputs.stable_release }}
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      DIST_TAG: ${{ inputs.dist_tag }}
      EVIDENCE_ARTIFACT: ${{ inputs.evidence_artifact }}
      VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
      TAG: v${{ inputs.version }}
      EVIDENCE_DIR: ${{ github.workspace }}/verified-evidence
      PUBLISH_DIR: ${{ github.workspace }}/publish-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v6
        with:
          node-version: 22

      - name: Validate inputs and immutable release identity
        id: inputs
        env:
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full lowercase 40-hex SHA"; exit 1; }
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          [[ "$VERSION" =~ $semver_re ]] || { echo "::error::Invalid version '$VERSION'"; exit 1; }
          [ "$EVIDENCE_ARTIFACT" = "release-evidence-${SOURCE_SHA}" ] || { echo "::error::evidence_artifact must be release-evidence-${SOURCE_SHA}"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || { echo "::error::checkout HEAD differs from source_sha"; exit 1; }
          test "$DISPATCH_SHA" = "$SOURCE_SHA" || { echo "::error::dispatch SHA $DISPATCH_SHA differs from source_sha $SOURCE_SHA"; exit 1; }
          test "$WORKFLOW_SHA" = "$SOURCE_SHA" || { echo "::error::workflow definition $WORKFLOW_SHA differs from source_sha $SOURCE_SHA"; exit 1; }
          node scripts/release/assert-publish-identity.mjs \
            --source-sha "$SOURCE_SHA" \
            --dispatch-sha "$DISPATCH_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --tag "$TAG"

          stable_release=false
          if [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            stable_release=true
            [ "$DIST_TAG" = latest ] || { echo "::error::stable releases must use latest"; exit 1; }
          else
            [[ "$VERSION" =~ -preview\.(0|[1-9][0-9]*)$ ]] || { echo "::error::unsupported prerelease '$VERSION'"; exit 1; }
            [[ "$DIST_TAG" =~ ^(insider|preview)$ ]] || { echo "::error::preview releases must use insider or preview"; exit 1; }
          fi

          if [ -n "$VERIFY_RUN_ID" ]; then
            [[ "$VERIFY_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::verify_run_id must contain digits only"; exit 1; }
            [ "$RUN_REF" = "refs/tags/${TAG}" ] || { echo "::error::direct recovery must be dispatched from refs/tags/${TAG}, not $RUN_REF"; exit 1; }
          fi
          echo "stable_release=$stable_release" >> "$GITHUB_OUTPUT"

      - name: Verify the cited Squad Release Verify run and artifact
        if: inputs.verify_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFY_RUN_ID}"
          test "$(gh api "$api" --jq '.head_sha')" = "$SOURCE_SHA" || { echo "::error::verify run head_sha does not match source_sha"; exit 1; }
          test "$(gh api "$api" --jq '.status')" = completed || { echo "::error::verify run is not completed"; exit 1; }
          test "$(gh api "$api" --jq '.conclusion')" = success || { echo "::error::verify run did not conclude success"; exit 1; }
          workflow_id="$(gh api "$api" --jq '.workflow_id')"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}" --jq '.path')" = '.github/workflows/squad-release-verify.yml' || {
            echo "::error::verify_run_id is not a Squad Release Verify run"; exit 1;
          }
          count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFY_RUN_ID}/artifacts" \
            --jq "[.artifacts[] | select(.name == \"${EVIDENCE_ARTIFACT}\" and .expired == false)] | length")"
          test "$count" = 1 || { echo "::error::expected one unexpired ${EVIDENCE_ARTIFACT} artifact on verify run ${VERIFY_RUN_ID}, found $count"; exit 1; }

      - name: Download evidence from the orchestrated release run
        if: inputs.verify_run_id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8
        with:
          name: ${{ inputs.evidence_artifact }}
          path: verified-evidence

      - name: Download evidence from the cited recovery run
        if: inputs.verify_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8
        with:
          name: ${{ inputs.evidence_artifact }}
          path: verified-evidence
          run-id: ${{ inputs.verify_run_id }}
          github-token: ${{ github.token }}

      - name: Recheck evidence hashes, manifests and privacy result
        run: |
          set -euo pipefail
          mkdir -p "$PUBLISH_DIR"
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { copyFileSync, existsSync, readFileSync, readdirSync, writeFileSync } = require('node:fs');
          const path = require('node:path');
          const evidence = process.env.EVIDENCE_DIR, publish = process.env.PUBLISH_DIR, version = process.env.VERSION;
          const report = JSON.parse(readFileSync(path.join(evidence, 'pack-evidence.json'), 'utf8'));
          if (!report.ok) throw new Error('pack-evidence.json does not report ok=true');
          const expected = ['@bradygaster/squad-sdk', '@bradygaster/squad-cli'];
          const tgzs = readdirSync(evidence).filter((f) => f.endsWith('.tgz')).sort();
          if (tgzs.length !== 2) throw new Error(`evidence must contain exactly two tarballs, found ${tgzs.join(', ')}`);
          const local = {};
          for (const name of expected) {
            const entry = report.packages?.[name];
            if (!entry) throw new Error(`missing evidence for ${name}`);
            if (entry.manifest?.version !== version) throw new Error(`${name} evidence version ${entry.manifest?.version} != ${version}`);
            if (name.endsWith('squad-cli') && entry.manifest?.sdkDependency !== version) throw new Error(`CLI evidence does not pin SDK exactly to ${version}`);
            if (!entry.privacy?.denyPatterns?.includes('email-upn')) throw new Error(`${name} evidence lacks the email-upn privacy rule`);
            if (entry.privacy?.hits?.length !== 0) throw new Error(`${name} evidence has privacy hits`);
            const tarball = path.join(evidence, entry.filename);
            if (!existsSync(tarball)) throw new Error(`missing ${entry.filename}`);
            const actual = createHash('sha256').update(readFileSync(tarball)).digest('hex');
            if (actual !== entry.sha256) throw new Error(`${name} sha256 ${actual} != evidence ${entry.sha256}`);
            const sum = readFileSync(`${tarball}.sha256`, 'utf8').trim();
            if (sum !== `${entry.sha256}  ${entry.filename}`) throw new Error(`${entry.filename}.sha256 does not match`);
            copyFileSync(tarball, path.join(publish, entry.filename));
            local[name] = {
              filename: entry.filename, bytes: entry.bytes, sha256: entry.sha256,
              integrity: entry.integrity, shasum: entry.shasum, files: entry.files,
              sdkDependency: entry.manifest?.sdkDependency ?? null,
            };
          }
          copyFileSync(path.join(evidence, 'pack-evidence.json'), path.join(publish, 'pack-evidence.json'));
          writeFileSync(path.join(publish, 'local-packs.json'), JSON.stringify(local, null, 2) + '\n');
          console.log(JSON.stringify(Object.fromEntries(expected.map((name) => [name, local[name].sha256])), null, 2));
          NODE
          node scripts/release/assert-publish-identity.mjs \
            --source-sha "$SOURCE_SHA" \
            --dispatch-sha "${{ github.sha }}" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --tag "$TAG" \
            --evidence-dir "$PUBLISH_DIR"

      - name: Name verified publish artifact
        id: publish-artifact
        run: echo "name=verified-publish-packs-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload exact verified publish tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7
        with:
          name: ${{ steps.publish-artifact.outputs.name }}
          path: publish-evidence/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish and reconcile exact verified tarballs
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      outcome: ${{ steps.reconcile.outputs.outcome }}
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      DIST_TAG: ${{ inputs.dist_tag }}
      ADD_PREVIEW_ALIAS: ${{ inputs.add_preview_alias }}
      TAG: v${{ inputs.version }}
      STAGING_TAG: staging-${{ github.run_id }}-${{ github.run_attempt }}
      PACKS_DIR: ${{ github.workspace }}/publish-evidence
      RECON_DIR: ${{ github.workspace }}/npm-reconciliation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8
        with:
          name: ${{ needs.prepare.outputs.publish_artifact }}
          path: publish-evidence

      - name: Classify exact registry versions (only explicit 404 means missing)
        id: existing
        run: |
          set -euo pipefail
          mkdir -p "$RECON_DIR"
          node <<'NODE' | tee -a "$GITHUB_OUTPUT"
          const cp = require('node:child_process'), fs = require('node:fs'), path = require('node:path');
          const version = process.env.VERSION;
          const local = JSON.parse(fs.readFileSync(path.join(process.env.PACKS_DIR, 'local-packs.json'), 'utf8'));
          const state = {};
          for (const name of ['@bradygaster/squad-sdk', '@bradygaster/squad-cli']) {
            const result = cp.spawnSync('npm', ['view', `${name}@${version}`, 'version', 'dist.integrity', '--json', `--registry=${process.env.PUBLIC_REGISTRY}`], { encoding: 'utf8' });
            const diagnostic = `${result.stdout ?? ''}\n${result.stderr ?? ''}`;
            if (result.status !== 0) {
              if (/\bE404\b|404 Not Found/i.test(diagnostic)) {
                state[name] = { state: 'missing', diagnostic: diagnostic.trim().slice(-500) };
                continue;
              }
              state[name] = { state: 'unknown', diagnostic: diagnostic.trim().slice(-500), exitCode: result.status };
              continue;
            }
            let data;
            try { data = JSON.parse(result.stdout || '{}'); } catch (error) {
              state[name] = { state: 'unknown', diagnostic: `invalid npm view JSON: ${error}` };
              continue;
            }
            if (data.version !== version || typeof data['dist.integrity'] !== 'string') {
              state[name] = { state: 'unknown', diagnostic: `unexpected registry response ${JSON.stringify(data)}` };
              continue;
            }
            const integrityMatches = data['dist.integrity'] === local[name].integrity;
            state[name] = { state: 'present', version: data.version, integrity: data['dist.integrity'], localIntegrity: local[name].integrity, integrityMatches };
            if (!integrityMatches) {
              fs.writeFileSync(path.join(process.env.RECON_DIR, 'pre-publish-state.json'), JSON.stringify(state, null, 2) + '\n');
              throw new Error(`${name}@${version} exists with different integrity`);
            }
          }
          fs.writeFileSync(path.join(process.env.RECON_DIR, 'pre-publish-state.json'), JSON.stringify(state, null, 2) + '\n');
          for (const [key, name] of [['sdk', '@bradygaster/squad-sdk'], ['cli', '@bradygaster/squad-cli']) {
            console.log(`${key}_state=${state[name].state}`);
          }
          const unknown = Object.entries(state).filter(([, value]) => value.state === 'unknown');
          if (unknown.length) {
            for (const [name, value] of unknown) console.error(`::error::${name}@${version} registry state is UNKNOWN: ${value.diagnostic}`);
            process.exit(1);
          }
          NODE

      - name: Stage SDK from the exact verified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SDK_STATE: ${{ steps.existing.outputs.sdk_state }}
        run: |
          set -euo pipefail
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::NPM_TOKEN is not configured"; exit 1; }
          node scripts/release/assert-publish-identity.mjs --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          if [ "$SDK_STATE" = present ]; then
            npm dist-tag add "@bradygaster/squad-sdk@${VERSION}" "$STAGING_TAG"
          elif [ "$SDK_STATE" = missing ]; then
            npm publish "$PACKS_DIR/bradygaster-squad-sdk-${VERSION}.tgz" --ignore-scripts --access public --provenance --tag "$STAGING_TAG"
          else
            echo "::error::SDK registry state must be present or missing, got '$SDK_STATE'"; exit 1
          fi

      - name: Stage CLI from the exact verified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CLI_STATE: ${{ steps.existing.outputs.cli_state }}
        run: |
          set -euo pipefail
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::NPM_TOKEN is not configured"; exit 1; }
          node scripts/release/assert-publish-identity.mjs --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          if [ "$CLI_STATE" = present ]; then
            npm dist-tag add "@bradygaster/squad-cli@${VERSION}" "$STAGING_TAG"
          elif [ "$CLI_STATE" = missing ]; then
            npm publish "$PACKS_DIR/bradygaster-squad-cli-${VERSION}.tgz" --ignore-scripts --access public --provenance --tag "$STAGING_TAG"
          else
            echo "::error::CLI registry state must be present or missing, got '$CLI_STATE'"; exit 1
          fi

      - name: Verify staged pair
        run: node scripts/release/npm-pair-verify.mjs --version "$VERSION" --tag "$STAGING_TAG" --local-packs "$PACKS_DIR/local-packs.json" --out "$RECON_DIR/verify-staging.json" --install-check --max-wait-seconds 900

      - name: Promote SDK to the primary channel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/assert-publish-identity.mjs --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          npm dist-tag add "@bradygaster/squad-sdk@${VERSION}" "$DIST_TAG"

      - name: Promote CLI to the primary channel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/assert-publish-identity.mjs --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          npm dist-tag add "@bradygaster/squad-cli@${VERSION}" "$DIST_TAG"

      - name: Verify primary channel
        run: node scripts/release/npm-pair-verify.mjs --version "$VERSION" --tag "$DIST_TAG" --local-packs "$PACKS_DIR/local-packs.json" --out "$RECON_DIR/verify-${DIST_TAG}.json" --max-wait-seconds 900

      - name: Add preview alias to SDK
        if: inputs.add_preview_alias && inputs.dist_tag != 'preview'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/assert-publish-identity.mjs --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          npm dist-tag add "@bradygaster/squad-sdk@${VERSION}" preview

      - name: Add preview alias to CLI
        if: inputs.add_preview_alias && inputs.dist_tag != 'preview'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/assert-publish-identity.mjs --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          npm dist-tag add "@bradygaster/squad-cli@${VERSION}" preview

      - name: Verify preview alias
        if: inputs.add_preview_alias && inputs.dist_tag != 'preview'
        run: node scripts/release/npm-pair-verify.mjs --version "$VERSION" --tag preview --local-packs "$PACKS_DIR/local-packs.json" --out "$RECON_DIR/verify-preview.json" --max-wait-seconds 600

      - name: Final two-package reconciliation
        id: reconcile
        if: always()
        run: |
          set +e
          node scripts/release/npm-pair-verify.mjs --version "$VERSION" --tag "$DIST_TAG" --local-packs "$PACKS_DIR/local-packs.json" --out "$RECON_DIR/final-reconciliation.json" --max-wait-seconds 300 --classify
          status=$?
          outcome="$(node -p 'require(process.env.RECON_DIR + "/final-reconciliation.json").outcome' 2>/dev/null || echo UNKNOWN)"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          if [ "$outcome" != COMPLETE ]; then
            echo "::error::npm publication outcome is $outcome. Re-dispatch recovery from the immutable tag with the same verify run and evidence artifact."
            exit 1
          fi
          exit "$status"

      - name: Remove SDK staging tag
        if: success()
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/assert-publish-identity.mjs --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          npm dist-tag rm @bradygaster/squad-sdk "$STAGING_TAG"

      - name: Remove CLI staging tag
        if: success()
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/assert-publish-identity.mjs --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          npm dist-tag rm @bradygaster/squad-cli "$STAGING_TAG"

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7
        with:
          name: npm-publish-reconciliation-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            npm-reconciliation/
            publish-evidence/
          retention-days: 90
          if-no-files-found: error

  promote-insider-tag:
    name: Promote insider dist-tags if behind latest
    needs: [prepare, publish]
    if: needs.prepare.outputs.stable_release == 'true' && needs.publish.outputs.outcome == 'COMPLETE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      TAG: v${{ inputs.version }}
      PACKS_DIR: ${{ github.workspace }}/publish-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8
        with:
          name: ${{ needs.prepare.outputs.publish_artifact }}
          path: publish-evidence
      - name: Promote SDK insider dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/assert-publish-identity.mjs --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          node scripts/promote-insider-tag.mjs @bradygaster/squad-sdk "$NEW_VERSION"
      - name: Promote CLI insider dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/assert-publish-identity.mjs --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          node scripts/promote-insider-tag.mjs @bradygaster/squad-cli "$NEW_VERSION"
