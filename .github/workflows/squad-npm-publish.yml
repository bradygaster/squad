name: Squad npm Publish

# Publishes exactly the two tarballs produced by Squad Release Verify.
#
# The workflow uses fail-closed reconciliation with idempotent partial-release
# recovery. Direct dispatch is recovery-only: it must run from the live merged
# dev workflow definition and cite the immutable release source, successful
# Squad Release Verify run, and matching evidence artifact separately.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (for example 2.0.0-preview.1)'
        required: true
        type: string
      source_sha:
        description: 'Full 40-hex commit SHA targeted by the release tag'
        required: true
        type: string
      recovery_sha:
        description: 'Empty for orchestrated release; exact merged dev workflow SHA for recovery'
        required: false
        default: ''
        type: string
      dist_tag:
        description: 'Primary npm dist-tag (insider, preview or latest)'
        required: true
        type: string
      add_preview_alias:
        description: 'Also point preview at this version after the primary tag verifies'
        required: false
        default: false
        type: boolean
      evidence_artifact:
        description: 'Exact release-evidence-<source_sha> artifact from Squad Release Verify'
        required: true
        type: string
      verify_run_id:
        description: 'Empty for the orchestrated release; required for direct recovery'
        required: false
        default: ''
        type: string
      publish_draft_release:
        description: 'Recovery only: publish the existing validated draft GitHub release after npm reconciles COMPLETE'
        required: false
        default: false
        type: boolean
    secrets:
      NPM_TOKEN:
        description: 'npm automation token used only by registry mutation steps'
        required: true
    outputs:
      outcome:
        description: 'COMPLETE, PARTIAL_PUBLISH or UNKNOWN'
        value: ${{ jobs.publish.outputs.outcome }}
      stable_release:
        description: 'true when the version is a stable MAJOR.MINOR.PATCH'
        value: ${{ jobs.prepare.outputs.stable_release }}
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to reconcile (for example 2.0.0-preview.1)'
        required: true
        type: string
      source_sha:
        description: 'Full 40-hex commit SHA targeted by the existing release tag'
        required: true
        type: string
      recovery_sha:
        description: 'Full 40-hex merged dev SHA containing this recovery workflow'
        required: true
        type: string
      dist_tag:
        description: 'Primary npm dist-tag'
        required: true
        default: insider
        type: choice
        options: [insider, preview, latest]
      add_preview_alias:
        description: 'Also point preview at this version after the primary tag verifies'
        required: false
        default: true
        type: boolean
      verify_run_id:
        description: 'Successful Squad Release Verify run ID at source_sha'
        required: true
        type: string
      evidence_artifact:
        description: 'Exact release-evidence-<source_sha> artifact from that run'
        required: true
        type: string
      publish_draft_release:
        description: 'Publish the existing draft release only after npm reconciliation completes'
        required: false
        default: false
        type: boolean

concurrency:
  group: squad-npm-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLIC_REGISTRY: https://registry.npmjs.org/
  SQUAD_RELEASE_RECOVERY: ${{ inputs.verify_run_id != '' }}
  SQUAD_RELEASE_CONTROL_REPO: ${{ github.workspace }}/release-control
  RECOVERY_SHA: ${{ inputs.recovery_sha }}
  RELEASE_SCRIPTS_ROOT: ${{ inputs.verify_run_id != '' && format('{0}/release-control/scripts/release', github.workspace) || format('{0}/scripts/release', github.workspace) }}

jobs:
  prepare:
    name: Validate tag, verification proof and exact tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      publish_artifact: ${{ steps.publish-artifact.outputs.name }}
      stable_release: ${{ steps.inputs.outputs.stable_release }}
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      DIST_TAG: ${{ inputs.dist_tag }}
      EVIDENCE_ARTIFACT: ${{ inputs.evidence_artifact }}
      VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
      TAG: v${{ inputs.version }}
      EVIDENCE_DIR: ${{ github.workspace }}/verified-evidence
      PUBLISH_DIR: ${{ github.workspace }}/publish-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Check out the recovery workflow definition
        if: inputs.verify_run_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.recovery_sha }}
          path: release-control
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v6
        with:
          node-version: 22

      - name: Validate inputs and immutable release identity
        id: inputs
        env:
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full lowercase 40-hex SHA"; exit 1; }
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          [[ "$VERSION" =~ $semver_re ]] || { echo "::error::Invalid version '$VERSION'"; exit 1; }
          [ "$EVIDENCE_ARTIFACT" = "release-evidence-${SOURCE_SHA}" ] || { echo "::error::evidence_artifact must be release-evidence-${SOURCE_SHA}"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || { echo "::error::checkout HEAD differs from source_sha"; exit 1; }
          if [ -n "$VERIFY_RUN_ID" ]; then
            [[ "$RECOVERY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::recovery_sha must be a full lowercase 40-hex SHA"; exit 1;
            }
            test "$RUN_REF" = refs/heads/dev || {
              echo "::error::direct recovery must be dispatched from dev, not $RUN_REF"; exit 1;
            }
            control_head="$(git -C "$SQUAD_RELEASE_CONTROL_REPO" rev-parse HEAD)"
            tip="$(git ls-remote --exit-code origin "$RUN_REF" | cut -f1)"
            for identity in \
              "dispatch SHA:$DISPATCH_SHA" \
              "workflow definition SHA:$WORKFLOW_SHA" \
              "recovery control checkout HEAD:$control_head" \
              "live $RUN_REF tip:$tip"; do
              name="${identity%%:*}"
              value="${identity#*:}"
              test "$value" = "$RECOVERY_SHA" || {
                echo "::error::$name $value differs from recovery_sha $RECOVERY_SHA"; exit 1;
              }
            done
          else
            test "$DISPATCH_SHA" = "$SOURCE_SHA" || { echo "::error::dispatch SHA $DISPATCH_SHA differs from source_sha $SOURCE_SHA"; exit 1; }
            test "$WORKFLOW_SHA" = "$SOURCE_SHA" || { echo "::error::workflow definition $WORKFLOW_SHA differs from source_sha $SOURCE_SHA"; exit 1; }
          fi
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" \
            --source-sha "$SOURCE_SHA" \
            --dispatch-sha "$DISPATCH_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --tag "$TAG"

          stable_release=false
          if [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            stable_release=true
            [ "$DIST_TAG" = latest ] || { echo "::error::stable releases must use latest"; exit 1; }
          else
            [[ "$VERSION" =~ -preview\.(0|[1-9][0-9]*)$ ]] || { echo "::error::unsupported prerelease '$VERSION'"; exit 1; }
            [[ "$DIST_TAG" =~ ^(insider|preview)$ ]] || { echo "::error::preview releases must use insider or preview"; exit 1; }
          fi

          if [ -n "$VERIFY_RUN_ID" ]; then
            [[ "$VERIFY_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::verify_run_id must contain digits only"; exit 1; }
          fi
          echo "stable_release=$stable_release" >> "$GITHUB_OUTPUT"

      - name: Verify the cited Squad Release Verify run and artifact
        if: inputs.verify_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFY_RUN_ID}"
          run_json="$(gh api "$api")"
          test "$(printf '%s' "$run_json" | jq -r '.head_sha')" = "$SOURCE_SHA" || { echo "::error::verify run head_sha does not match source_sha"; exit 1; }
          test "$(printf '%s' "$run_json" | jq -r '.status')" = completed || { echo "::error::verify run is not completed"; exit 1; }
          workflow_path="$(printf '%s' "$run_json" | jq -r '.path')"
          case "$workflow_path" in
            .github/workflows/squad-release-verify.yml)
              test "$(printf '%s' "$run_json" | jq -r '.conclusion')" = success || {
                echo "::error::standalone Squad Release Verify run did not conclude success"; exit 1;
              }
              ;;
            .github/workflows/squad-release.yml)
              verify_jobs="$(gh api --paginate "${api}/jobs" --jq '[.jobs[] | select((.name == "Verify exact SHA and build evidence" or (.name | endswith("/ Verify exact SHA and build evidence"))) and .status == "completed" and .conclusion == "success")] | length' | awk '{sum += $1} END {print sum + 0}')"
              test "$verify_jobs" = 1 || {
                echo "::error::release orchestrator run must contain exactly one successful exact-SHA verify job, found $verify_jobs"; exit 1;
              }
              ;;
            *)
              echo "::error::verify_run_id belongs to unexpected workflow $workflow_path"; exit 1 ;;
          esac
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFY_RUN_ID}/artifacts")"
          count="$(printf '%s' "$artifacts" | jq "[.artifacts[] | select(.name == \"${EVIDENCE_ARTIFACT}\" and .expired == false)] | length")"
          test "$count" = 1 || { echo "::error::expected one unexpired ${EVIDENCE_ARTIFACT} artifact on verify run ${VERIFY_RUN_ID}, found $count"; exit 1; }
          expires_at="$(printf '%s' "$artifacts" | jq -r ".artifacts[] | select(.name == \"${EVIDENCE_ARTIFACT}\" and .expired == false) | .expires_at")"
          remaining=$(( $(date -d "$expires_at" +%s) - $(date +%s) ))
          if [ "$remaining" -lt 604800 ]; then
            echo "::warning::${EVIDENCE_ARTIFACT} expires at ${expires_at}; complete recovery before it expires."
          fi

      - name: Download evidence from the orchestrated release run
        if: inputs.verify_run_id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8
        with:
          name: ${{ inputs.evidence_artifact }}
          path: verified-evidence

      - name: Download evidence from the cited recovery run
        if: inputs.verify_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8
        with:
          name: ${{ inputs.evidence_artifact }}
          path: verified-evidence
          run-id: ${{ inputs.verify_run_id }}
          github-token: ${{ github.token }}

      - name: Recheck evidence hashes, manifests and privacy result
        env:
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$PUBLISH_DIR"
          node "$RELEASE_SCRIPTS_ROOT/verify-publish-evidence.mjs"
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" \
            --source-sha "$SOURCE_SHA" \
            --dispatch-sha "${{ github.sha }}" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --tag "$TAG" \
            --evidence-dir "$PUBLISH_DIR"

      - name: Name verified publish artifact
        id: publish-artifact
        run: echo "name=verified-publish-packs-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload exact verified publish tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7
        with:
          name: ${{ steps.publish-artifact.outputs.name }}
          path: publish-evidence/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish and reconcile exact verified tarballs
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      outcome: ${{ steps.reconcile.outputs.outcome }}
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      DIST_TAG: ${{ inputs.dist_tag }}
      ADD_PREVIEW_ALIAS: ${{ inputs.add_preview_alias }}
      TAG: v${{ inputs.version }}
      STAGING_TAG: staging-${{ github.run_id }}-${{ github.run_attempt }}
      PACKS_DIR: ${{ github.workspace }}/publish-evidence
      RECON_DIR: ${{ github.workspace }}/npm-reconciliation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Check out the recovery workflow definition
        if: inputs.verify_run_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.recovery_sha }}
          path: release-control
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8
        with:
          name: ${{ needs.prepare.outputs.publish_artifact }}
          path: publish-evidence

      - name: Classify exact registry versions and dist-tags
        id: existing
        run: |
          set -euo pipefail
          mkdir -p "$RECON_DIR"
          cp "$PACKS_DIR/release-identity.json" "$RECON_DIR/release-identity.json"
          node "$RELEASE_SCRIPTS_ROOT/classify-npm-registry.mjs" | tee -a "$GITHUB_OUTPUT"

      - name: Stage SDK from the exact verified tarball
        if: steps.existing.outputs.stage_pair == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SDK_STATE: ${{ steps.existing.outputs.sdk_state }}
        run: |
          set -euo pipefail
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::NPM_TOKEN is not configured"; exit 1; }
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          if [ "$SDK_STATE" = present ]; then
            npm dist-tag add "@bradygaster/squad-sdk@${VERSION}" "$STAGING_TAG"
          elif [ "$SDK_STATE" = missing ]; then
            npm publish "$PACKS_DIR/bradygaster-squad-sdk-${VERSION}.tgz" --ignore-scripts --access public --provenance --tag "$STAGING_TAG"
          else
            echo "::error::SDK registry state must be present or missing, got '$SDK_STATE'"; exit 1
          fi

      - name: Stage CLI from the exact verified tarball
        if: steps.existing.outputs.stage_pair == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CLI_STATE: ${{ steps.existing.outputs.cli_state }}
        run: |
          set -euo pipefail
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::NPM_TOKEN is not configured"; exit 1; }
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          if [ "$CLI_STATE" = present ]; then
            npm dist-tag add "@bradygaster/squad-cli@${VERSION}" "$STAGING_TAG"
          elif [ "$CLI_STATE" = missing ]; then
            npm publish "$PACKS_DIR/bradygaster-squad-cli-${VERSION}.tgz" --ignore-scripts --access public --provenance --tag "$STAGING_TAG"
          else
            echo "::error::CLI registry state must be present or missing, got '$CLI_STATE'"; exit 1
          fi

      - name: Verify staged pair
        if: steps.existing.outputs.stage_pair == 'true'
        run: node scripts/release/npm-pair-verify.mjs --version "$VERSION" --tag "$STAGING_TAG" --local-packs "$PACKS_DIR/local-packs.json" --out "$RECON_DIR/verify-staging.json" --install-check --max-wait-seconds 900

      - name: Promote SDK to the primary channel
        if: steps.existing.outputs.set_sdk_primary == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          npm dist-tag add "@bradygaster/squad-sdk@${VERSION}" "$DIST_TAG"

      - name: Promote CLI to the primary channel
        if: steps.existing.outputs.set_cli_primary == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          npm dist-tag add "@bradygaster/squad-cli@${VERSION}" "$DIST_TAG"

      - name: Verify primary channel
        run: node scripts/release/npm-pair-verify.mjs --version "$VERSION" --tag "$DIST_TAG" --local-packs "$PACKS_DIR/local-packs.json" --out "$RECON_DIR/verify-${DIST_TAG}.json" --max-wait-seconds 900

      - name: Add preview alias to SDK
        if: steps.existing.outputs.set_sdk_preview == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          npm dist-tag add "@bradygaster/squad-sdk@${VERSION}" preview

      - name: Add preview alias to CLI
        if: steps.existing.outputs.set_cli_preview == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          npm dist-tag add "@bradygaster/squad-cli@${VERSION}" preview

      - name: Verify preview alias
        if: inputs.add_preview_alias && inputs.dist_tag != 'preview'
        run: node scripts/release/npm-pair-verify.mjs --version "$VERSION" --tag preview --local-packs "$PACKS_DIR/local-packs.json" --out "$RECON_DIR/verify-preview.json" --max-wait-seconds 600

      - name: Final two-package reconciliation
        id: reconcile
        if: always()
        run: |
          set +e
          node scripts/release/npm-pair-verify.mjs --version "$VERSION" --tag "$DIST_TAG" --local-packs "$PACKS_DIR/local-packs.json" --out "$RECON_DIR/final-reconciliation.json" --max-wait-seconds 300 --classify
          status=$?
          outcome="$(node -p 'require(process.env.RECON_DIR + "/final-reconciliation.json").outcome' 2>/dev/null || echo UNKNOWN)"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          if [ "$outcome" != COMPLETE ]; then
            echo "::error::npm publication outcome is $outcome. Re-dispatch from live dev with the same source SHA, verify run, evidence artifact, and recovery_sha set to the live merged workflow tip."
            exit 1
          fi
          exit "$status"

      - name: Remove SDK staging tag
        if: success() && steps.existing.outputs.stage_pair == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          npm dist-tag rm @bradygaster/squad-sdk "$STAGING_TAG"

      - name: Remove CLI staging tag
        if: success() && steps.existing.outputs.stage_pair == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          npm dist-tag rm @bradygaster/squad-cli "$STAGING_TAG"

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7
        with:
          name: npm-publish-reconciliation-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            npm-reconciliation/
            publish-evidence/
          retention-days: 90
          if-no-files-found: error

  publish-draft-release:
    name: Publish the existing draft after recovery reconciliation
    needs: [prepare, publish]
    if: inputs.verify_run_id != '' && inputs.publish_draft_release && needs.publish.outputs.outcome == 'COMPLETE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      TAG: v${{ inputs.version }}
      VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
      PACKS_DIR: ${{ github.workspace }}/publish-evidence
      CHECKSUMS_DIR: ${{ github.workspace }}/immutable-standalone-checksums
      DRAFT_ASSETS_DIR: ${{ github.workspace }}/draft-release-assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Check out the recovery workflow definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.recovery_sha }}
          path: release-control
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v6
        with:
          node-version: 22
      - name: Require the immutable standalone checksum artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFY_RUN_ID}/artifacts")"
          count="$(printf '%s' "$artifacts" | jq '[.artifacts[] | select(.name == "standalone-release-checksums" and .expired == false)] | length')"
          test "$count" = 1 || {
            echo "::error::expected exactly one unexpired standalone-release-checksums artifact on run $VERIFY_RUN_ID, found $count"; exit 1;
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8
        with:
          name: standalone-release-checksums
          path: immutable-standalone-checksums
          run-id: ${{ inputs.verify_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8
        with:
          name: ${{ needs.prepare.outputs.publish_artifact }}
          path: publish-evidence
      - name: Validate and publish the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_CHECKSUMS: ${{ github.workspace }}/immutable-standalone-checksums/SHA256SUMS.txt
          PACK_EVIDENCE: ${{ github.workspace }}/publish-evidence/pack-evidence.json
        run: |
          set -euo pipefail
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" \
            --source-sha "$SOURCE_SHA" \
            --dispatch-sha "${{ github.sha }}" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --tag "$TAG"
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish,assets)"
          test "$(printf '%s' "$release_json" | jq -r '.isDraft')" = true || {
            echo "::error::release $TAG must already exist as a draft; recovery never recreates a release"; exit 1;
          }
          test "$(printf '%s' "$release_json" | jq -r '.targetCommitish')" = "$SOURCE_SHA" || {
            echo "::error::draft release target does not match source_sha"; exit 1;
          }
          expected_prerelease=true
          [[ "${{ inputs.version }}" =~ - ]] || expected_prerelease=false
          test "$(printf '%s' "$release_json" | jq -r '.isPrerelease')" = "$expected_prerelease" || {
            echo "::error::draft release prerelease state is unexpected"; exit 1;
          }
          release_json_path="$RUNNER_TEMP/draft-release.json"
          printf '%s' "$release_json" > "$release_json_path"
          node "$RELEASE_SCRIPTS_ROOT/verify-draft-release-assets.mjs" --release-json "$release_json_path"
          mkdir -p "$DRAFT_ASSETS_DIR"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$DRAFT_ASSETS_DIR"
          node "$RELEASE_SCRIPTS_ROOT/verify-draft-release-assets.mjs"
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" \
            --source-sha "$SOURCE_SHA" \
            --dispatch-sha "${{ github.sha }}" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --tag "$TAG"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          actual="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          test "$actual" = "false $expected_prerelease" || {
            echo "::error::release $TAG final state is '$actual'"; exit 1;
          }
          echo "✅ Existing draft $TAG published only after npm reconciliation COMPLETE."

  promote-insider-tag:
    name: Promote insider dist-tags if behind latest
    needs: [prepare, publish]
    if: needs.prepare.outputs.stable_release == 'true' && needs.publish.outputs.outcome == 'COMPLETE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      TAG: v${{ inputs.version }}
      PACKS_DIR: ${{ github.workspace }}/publish-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Check out the recovery workflow definition
        if: inputs.verify_run_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.recovery_sha }}
          path: release-control
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8
        with:
          name: ${{ needs.prepare.outputs.publish_artifact }}
          path: publish-evidence
      - name: Promote SDK insider dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          node scripts/promote-insider-tag.mjs @bradygaster/squad-sdk "$NEW_VERSION"
      - name: Promote CLI insider dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node "$RELEASE_SCRIPTS_ROOT/assert-publish-identity.mjs" --source-sha "$SOURCE_SHA" --dispatch-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" --tag "$TAG" --evidence-dir "$PACKS_DIR"
          node scripts/promote-insider-tag.mjs @bradygaster/squad-cli "$NEW_VERSION"
