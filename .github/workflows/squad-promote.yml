name: Squad Promote

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - validate the sanitized merge without pushing main'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  dev-to-main:
    name: Promote sanitized dev to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare sanitized stable promotion
        id: prepare
        run: |
          set -euo pipefail

          git fetch origin \
            '+refs/heads/dev:refs/remotes/origin/dev' \
            '+refs/heads/main:refs/remotes/origin/main' \
            --tags
          echo "=== dev HEAD ==="
          git log origin/dev -1 --oneline
          echo "=== main HEAD ==="
          git log origin/main -1 --oneline

          if git merge-base --is-ancestor origin/dev origin/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main already contains dev; nothing to promote."
            exit 0
          fi

          git checkout -B main origin/main
          git merge origin/dev --no-commit --no-ff -X theirs || true

          unmerged="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unmerged" ]; then
            echo "::error::The dev-to-main merge left unresolved conflicts:"
            printf '%s\n' "$unmerged"
            exit 1
          fi

          git rm -rf --cached --ignore-unmatch \
            .ai-team/ \
            .squad/ \
            .ai-team-templates/ \
            team-docs/ \
            docs/proposals/

          forbidden="$(git ls-files | grep -E '^(\.(ai-team|squad|ai-team-templates)/|team-docs/|docs/proposals/)' || true)"
          if [ -n "$forbidden" ]; then
            echo "::error::Forbidden internal files remain in the release tree:"
            printf '%s\n' "$forbidden"
            exit 1
          fi

          version="$(node -p 'require("./package.json").version')"
          stable_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $stable_re ]]; then
            echo "::error::Stable promotion requires a MAJOR.MINOR.PATCH version, got '$version'."
            exit 1
          fi

          for manifest in packages/squad-sdk/package.json packages/squad-cli/package.json; do
            package_version="$(node -p "require('./${manifest}').version")"
            if [ "$package_version" != "$version" ]; then
              echo "::error::$manifest version '$package_version' does not match root version '$version'."
              exit 1
            fi
          done
          sdk_dependency="$(node -p "require('./packages/squad-cli/package.json').dependencies['@bradygaster/squad-sdk']")"
          lock_dependency="$(node -p "require('./package-lock.json').packages['packages/squad-cli'].dependencies['@bradygaster/squad-sdk']")"
          if [[ "$sdk_dependency" == *-* ]] || [[ "$lock_dependency" == *-* ]]; then
            echo "::error::Stable promotion cannot retain a prerelease SDK dependency floor."
            exit 1
          fi

          if ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "::error::Version $version is missing from CHANGELOG.md."
            exit 1
          fi

          git diff --cached --check
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Prepared sanitized stable release v$version."
          git diff --cached --stat

      - name: Install dependencies
        if: steps.prepare.outputs.changed == 'true'
        run: npm ci

      - name: Build release tree
        if: steps.prepare.outputs.changed == 'true'
        # Internal .squad sources have already been removed from the release
        # index, so avoid the root prebuild template synchronization.
        run: npm -w packages/squad-sdk run build && npm -w packages/squad-cli run build

      - name: Run release tests
        if: steps.prepare.outputs.changed == 'true'
        run: node --test test/*.test.cjs

      - name: Push main and start stable release
        if: steps.prepare.outputs.changed == 'true' && inputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git commit -m "chore: promote dev to main (v${VERSION})"
          git push origin HEAD:main
          # Pushes authenticated with GITHUB_TOKEN do not emit another workflow
          # run, so explicitly dispatch the stable release at the pushed ref.
          gh workflow run squad-release.yml \
            --ref main \
            -f confirm_tag="v${VERSION}"
          echo "Pushed main and dispatched stable release v${VERSION}."

      - name: Report dry run
        if: steps.prepare.outputs.changed == 'true' && inputs.dry_run == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: echo "Dry run passed for sanitized stable release v${VERSION}; main was not changed."
