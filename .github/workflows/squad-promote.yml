name: Squad Promote

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - validate the sanitized merge without pushing main'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      promotion_branch:
        description: 'Existing validated in-repository promotion branch to open as a bot-authored PR'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  open-existing-promotion:
    if: ${{ inputs.promotion_branch != '' }}
    name: Open validated promotion PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validate promotion branch input
        env:
          BRANCH: ${{ inputs.promotion_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${BRANCH}" =~ ^chore/promote(-v)?-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Promotion branch must match chore/promote-X.Y.Z or chore/promote-vX.Y.Z."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --silent

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.promotion_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Validate existing promotion tree
        id: validate
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor origin/main HEAD || {
            echo "::error::Promotion branch must descend from the current main branch."
            exit 1
          }

          forbidden="$(git ls-files | grep -E '^(\.(ai-team|squad|ai-team-templates)/|team-docs/|docs/proposals/)' || true)"
          if [ -n "${forbidden}" ]; then
            echo "::error::Forbidden internal files remain in the promotion branch:"
            printf '%s\n' "${forbidden}"
            exit 1
          fi

          changesets="$(git ls-files '.changeset/*.md' | grep -v '^.changeset/README.md$' || true)"
          if [ -n "${changesets}" ]; then
            echo "::error::Consumed changesets remain in the promotion branch:"
            printf '%s\n' "${changesets}"
            exit 1
          fi

          version="$(node -p 'require("./package.json").version')"
          stable_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "${version}" =~ ${stable_re} ]]; then
            echo "::error::Stable promotion requires a MAJOR.MINOR.PATCH version, got '${version}'."
            exit 1
          fi

          for manifest in packages/squad-sdk/package.json packages/squad-cli/package.json; do
            package_version="$(node -p "require('./${manifest}').version")"
            if [ "${package_version}" != "${version}" ]; then
              echo "::error::${manifest} version '${package_version}' does not match root version '${version}'."
              exit 1
            fi
          done

          lock_root="$(node -p 'require("./package-lock.json").version')"
          lock_sdk="$(node -p 'require("./package-lock.json").packages["packages/squad-sdk"].version')"
          lock_cli="$(node -p 'require("./package-lock.json").packages["packages/squad-cli"].version')"
          if [ "${lock_root}" != "${version}" ] || [ "${lock_sdk}" != "${version}" ] || [ "${lock_cli}" != "${version}" ]; then
            echo "::error::package-lock.json package versions must all match '${version}'."
            exit 1
          fi

          expected_sdk_dependency=">=${version}"
          sdk_dependency="$(node -p "require('./packages/squad-cli/package.json').dependencies['@bradygaster/squad-sdk']")"
          lock_dependency="$(node -p "require('./package-lock.json').packages['packages/squad-cli'].dependencies['@bradygaster/squad-sdk']")"
          if [ "${sdk_dependency}" != "${expected_sdk_dependency}" ] || [ "${lock_dependency}" != "${expected_sdk_dependency}" ]; then
            echo "::error::CLI SDK dependency floors must both be '${expected_sdk_dependency}'."
            exit 1
          fi

          grep -Fq "## [${version}]" CHANGELOG.md || {
            echo "::error::Version ${version} is missing from CHANGELOG.md."
            exit 1
          }

          test -z "$(git status --porcelain)" || {
            echo "::error::Promotion branch checkout is not clean."
            git status --short
            exit 1
          }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build release tree
        env:
          SKIP_BUILD_BUMP: '1'
        run: npm run build

      - name: Run release tests
        run: node --test test/*.test.cjs

      - name: Verify validation did not mutate the branch
        run: |
          test -z "$(git status --porcelain)" || {
            echo "::error::Build or tests modified the promotion branch."
            git status --short
            exit 1
          }

      - name: Open bot-authored promotion PR
        if: inputs.dry_run == 'false'
        env:
          BRANCH: ${{ inputs.promotion_branch }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          existing_url="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --base main \
            --head "${BRANCH}" \
            --json url \
            --jq '.[0].url // ""')"
          if [ -n "${existing_url}" ]; then
            echo "Promotion PR already exists: ${existing_url}"
            exit 0
          fi

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${BRANCH}" \
            --title "chore(release): promote dev to main (v${VERSION})" \
            --body "Bot-authored promotion PR for validated Squad v${VERSION} release branch \`${BRANCH}\`.

          Validation run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          The repository's required pull-request checks may initially wait for a maintainer to approve workflow execution because this PR was created with \`GITHUB_TOKEN\`."

  dev-to-main:
    if: ${{ inputs.promotion_branch == '' }}
    name: Promote sanitized dev to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare sanitized stable promotion
        id: prepare
        run: |
          set -euo pipefail

          git fetch origin \
            '+refs/heads/dev:refs/remotes/origin/dev' \
            '+refs/heads/main:refs/remotes/origin/main' \
            --tags
          echo "=== dev HEAD ==="
          git log origin/dev -1 --oneline
          echo "=== main HEAD ==="
          git log origin/main -1 --oneline

          if git merge-base --is-ancestor origin/dev origin/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main already contains dev; nothing to promote."
            exit 0
          fi

          git checkout -B main origin/main
          # -X no-renames: dev has many newly-added template/charter files that
          # don't exist at the merge-base; without this, git's rename-detection
          # heuristic falsely pairs them with unrelated files independently
          # deleted on main, producing spurious rename/delete conflicts.
          git merge origin/dev --no-commit --no-ff -X theirs -X no-renames || true

          # Strip internal-only paths *before* checking for unresolved
          # conflicts. These paths are always removed from the release tree
          # regardless of merge outcome, so a delete(main)/modify(dev)
          # conflict on them isn't a real decision — resolve it here so it
          # doesn't block the dev-to-main promotion below.
          git rm -rf --cached --ignore-unmatch \
            .ai-team/ \
            .squad/ \
            .ai-team-templates/ \
            team-docs/ \
            docs/proposals/

          # squad-preview.yml was intentionally removed on dev (83612744,
          # "finalize preview and stable release channels", which consolidated
          # preview/stable release logic into squad-release.yml) while main
          # independently hardened it with SHA-pinned action refs before that
          # redesign landed. Accept dev's removal; the equivalent
          # functionality now lives in squad-release.yml.
          git rm -f --cached --ignore-unmatch .github/workflows/squad-preview.yml

          unmerged="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unmerged" ]; then
            echo "::error::The dev-to-main merge left unresolved conflicts:"
            printf '%s\n' "$unmerged"
            exit 1
          fi

          forbidden="$(git ls-files | grep -E '^(\.(ai-team|squad|ai-team-templates)/|team-docs/|docs/proposals/)' || true)"
          if [ -n "$forbidden" ]; then
            echo "::error::Forbidden internal files remain in the release tree:"
            printf '%s\n' "$forbidden"
            exit 1
          fi

          version="$(node -p 'require("./package.json").version')"
          stable_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $stable_re ]]; then
            echo "::error::Stable promotion requires a MAJOR.MINOR.PATCH version, got '$version'."
            exit 1
          fi

          for manifest in packages/squad-sdk/package.json packages/squad-cli/package.json; do
            package_version="$(node -p "require('./${manifest}').version")"
            if [ "$package_version" != "$version" ]; then
              echo "::error::$manifest version '$package_version' does not match root version '$version'."
              exit 1
            fi
          done
          sdk_dependency="$(node -p "require('./packages/squad-cli/package.json').dependencies['@bradygaster/squad-sdk']")"
          lock_dependency="$(node -p "require('./package-lock.json').packages['packages/squad-cli'].dependencies['@bradygaster/squad-sdk']")"
          if [[ "$sdk_dependency" == *-* ]] || [[ "$lock_dependency" == *-* ]]; then
            echo "::error::Stable promotion cannot retain a prerelease SDK dependency floor."
            exit 1
          fi

          if ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "::error::Version $version is missing from CHANGELOG.md."
            exit 1
          fi

          # cr-at-eol: the repo deliberately keeps ~95 .ts files CRLF-encoded
          # (see .gitattributes) to avoid a disruptive renormalization commit.
          # Without this, --check flags every added line in those files as
          # "trailing whitespace" merely for ending in \r\n, which would fail
          # every promotion that touches them. This still catches genuine
          # trailing spaces/tabs and blank-line-at-EOF issues.
          git -c core.whitespace=cr-at-eol diff --cached --check
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Prepared sanitized stable release v$version."
          git diff --cached --stat

      - name: Install dependencies
        if: steps.prepare.outputs.changed == 'true'
        run: npm ci

      - name: Build release tree
        if: steps.prepare.outputs.changed == 'true'
        # Internal .squad sources have already been removed from the release
        # index, so avoid the root prebuild template synchronization.
        run: npm -w packages/squad-sdk run build && npm -w packages/squad-cli run build

      - name: Run release tests
        if: steps.prepare.outputs.changed == 'true'
        run: node --test test/*.test.cjs

      - name: Push main and start stable release
        if: steps.prepare.outputs.changed == 'true' && inputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git commit -m "chore: promote dev to main (v${VERSION})"
          git push origin HEAD:main
          # Pushes authenticated with GITHUB_TOKEN do not emit another workflow
          # run, so explicitly dispatch the stable release at the pushed ref.
          gh workflow run squad-release.yml \
            --ref main \
            -f confirm_tag="v${VERSION}"
          echo "Pushed main and dispatched stable release v${VERSION}."

      - name: Report dry run
        if: steps.prepare.outputs.changed == 'true' && inputs.dry_run == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: echo "Dry run passed for sanitized stable release v${VERSION}; main was not changed."
