name: Squad Standalone Bundles

# Builds self-contained, npm-free Squad bundles for every supported platform and
# attaches them to a GitHub Release.
#
# Each bundle vendors its own Node.js runtime, so installing Squad from these
# artifacts touches github.com only — never registry.npmjs.org. This is what
# unblocks self-hosted runners and developer machines behind a firewall that
# blocks the npm registry (see #1593, and the deferred limitation in #1587).
#
# npm is still used at *build* time inside this workflow to resolve the
# dependency tree; it is the runtime dependency that is removed.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js runtime version to vendor into the bundles'
        required: false
        default: '22.20.0'
        type: string
      upload:
        description: 'Attach the built bundles to the requested release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'GitHub Release tag that receives the bundles'
        required: false
        default: ''
        type: string
      source_ref:
        description: 'Git ref whose source is bundled'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js runtime version to vendor into the bundles'
        required: false
        default: '22.20.0'
        type: string
      upload:
        description: 'Attach the built bundles to the release matching the current tag'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'GitHub Release tag that receives the bundles (defaults to the selected tag)'
        required: false
        default: ''
        type: string
      source_ref:
        description: 'Git ref whose source is bundled (defaults to release_tag or the selected ref)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: ${{ inputs.node_version || '22.20.0' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            platform: linux
            arch: x64
            runner: ubuntu-latest
          - target: linux-arm64
            platform: linux
            arch: arm64
            runner: ubuntu-latest
          - target: darwin-x64
            platform: darwin
            arch: x64
            runner: ubuntu-latest
          - target: darwin-arm64
            platform: darwin
            arch: arm64
            runner: ubuntu-latest
          - target: win32-x64
            platform: win32
            arch: x64
            runner: ubuntu-latest
          - target: win32-arm64
            platform: win32
            arch: arm64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag || github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v6
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure unzip is available
        # GNU tar cannot read zip archives, so cross-building a Windows bundle
        # on a Linux runner needs unzip to unpack the Node runtime.
        if: matrix.platform == 'win32'
        run: |
          set -euo pipefail
          command -v unzip >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq unzip
          }
          unzip -v | head -n 1

      - name: Build packages
        # Root prebuild synchronizes contributor-only .squad sources that are
        # intentionally absent from release tags. Package builds consume the
        # already-synchronized templates committed with the release.
        run: npm -w packages/squad-sdk run build && npm -w packages/squad-cli run build

      - name: Build standalone bundle
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node scripts/build-standalone.mjs \
            --platform "${TARGET_PLATFORM}" \
            --arch "${TARGET_ARCH}" \
            --node-version "${NODE_VERSION}"

      - name: Package bundle
        id: package
        working-directory: dist-standalone
        env:
          TARGET: ${{ matrix.target }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [ "${TARGET_PLATFORM}" = "win32" ]; then
            asset="squad-${TARGET}.zip"
            zip -qr "${asset}" "squad-${TARGET}"
          else
            asset="squad-${TARGET}.tar.gz"
            tar -czf "${asset}" "squad-${TARGET}"
          fi
          sha256sum "${asset}" > "${asset}.sha256"
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"
          ls -lh "${asset}"

      - name: Smoke test bundle
        # The vendored runtime only executes on a matching host, so the CLI can
        # only be invoked for the native target. Cross-built bundles are
        # verified structurally instead.
        env:
          TARGET: ${{ matrix.target }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          bundle="dist-standalone/squad-${TARGET}"
          if [ "${TARGET}" = "linux-x64" ]; then
            actual="$("${bundle}/squad" --version)"
            echo "squad --version -> ${actual}"
            test -n "${actual}"
          else
            test -f "${bundle}/BUNDLE-INFO.json"
            test -d "${bundle}/app/node_modules/@bradygaster/squad-cli"
            if [ "${TARGET_PLATFORM}" = "win32" ]; then
              # squad.exe is a Node single executable built from the vendored
              # runtime, so it replaces runtime/node.exe rather than sitting
              # next to it. winget requires this real .exe — its portable
              # installer does not accept .cmd targets.
              test -f "${bundle}/squad.exe"
              test -f "${bundle}/squad.cmd"
              test ! -d "${bundle}/runtime"
            else
              test -f "${bundle}/runtime/bin/node"
              test -f "${bundle}/squad"
            fi
            echo "Layout verified for ${TARGET} (cross-built, not executable here)"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
        with:
          name: squad-${{ matrix.target }}
          path: |
            dist-standalone/${{ steps.package.outputs.asset }}
            dist-standalone/${{ steps.package.outputs.asset }}.sha256
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Attach bundles to release
    needs: build
    if: github.event_name == 'release' || inputs.upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Build combined SHA256SUMS.txt
        working-directory: artifacts
        run: |
          set -euo pipefail
          cat ./*.sha256 > SHA256SUMS.txt
          rm -f ./*.sha256
          cat SHA256SUMS.txt

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        working-directory: artifacts
        run: |
          set -euo pipefail
          gh release upload "${TAG}" ./* --clobber --repo "${GITHUB_REPOSITORY}"

  packaging:
    name: Generate Homebrew and winget manifests
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v6
        with:
          node-version: 22

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate manifests
        env:
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          cat artifacts/*.sha256 > "${RUNNER_TEMP}/SHA256SUMS.txt"
          node scripts/generate-packaging.mjs \
            --version "${TAG}" \
            --checksums "${RUNNER_TEMP}/SHA256SUMS.txt" \
            --out-dir dist-packaging

      # Submitting to homebrew-core and winget-pkgs requires pushing to
      # repositories this workflow has no credentials for, so the manifests are
      # published as an artifact for a maintainer to submit. Automating the
      # submission is follow-up work once the packages are accepted once.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
        with:
          name: packaging-manifests
          path: dist-packaging/
          retention-days: 30
          if-no-files-found: error

      - name: Summarize
        env:
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "### Packaging manifests for ${TAG}"
            echo ""
            echo "Download the \`packaging-manifests\` artifact, then:"
            echo ""
            # shellcheck disable=SC2016
            echo '- Homebrew — copy `homebrew/squad.rb` into the tap as `Casks/squad.rb`.'
            # shellcheck disable=SC2016
            echo '- winget — copy `winget/` into `winget-pkgs/manifests/b/bradygaster/Squad/<version>/`,'
            # shellcheck disable=SC2016
            echo '  validate with `winget validate --manifest <dir>`, then open the PR.'
          } >> "${GITHUB_STEP_SUMMARY}"
