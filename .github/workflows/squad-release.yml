name: Squad Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_tag:
        description: 'Type the exact release tag from package.json (for example v0.13.1)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.check_tag.outputs.exists == 'false' }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v6
        with:
          node-version: 22

      - name: Validate manual release request
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_TAG: ${{ inputs.confirm_tag }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          expected_tag="v$(node -p 'require("./package.json").version')"
          if [ "${RELEASE_REF}" != "refs/heads/dev" ]; then
            echo "::error::Manual standalone releases must be dispatched from dev, not ${RELEASE_REF}."
            exit 1
          fi
          if [ "${CONFIRM_TAG}" != "${expected_tag}" ]; then
            echo "::error::confirm_tag must be ${expected_tag}, got ${CONFIRM_TAG}."
            exit 1
          fi
          echo "Confirmed manual standalone release ${expected_tag} from dev."

      - name: Run tests
        run: node --test test/*.test.cjs

      - name: Validate version consistency
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md 2>/dev/null; then
            echo "::error::Version $VERSION not found in CHANGELOG.md — update CHANGELOG.md before release"
            exit 1
          fi
          echo "✅ Version $VERSION validated in CHANGELOG.md"

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION (tag: v$VERSION)"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Tag ${{ steps.version.outputs.tag }} already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "🆕 Tag ${{ steps.version.outputs.tag }} does not exist — creating release."
          fi

      - name: Create git tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --latest

      - name: Verify release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}"
          echo "✅ Release ${{ steps.version.outputs.tag }} created and verified."

  standalone:
    name: Publish standalone bundles
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/squad-standalone-release.yml
    with:
      upload: true
      release_tag: ${{ needs.release.outputs.tag }}
      source_ref: ${{ needs.release.outputs.tag }}
