name: Squad Agent Binding Check

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Squad]
    types: [completed]

permissions:
  contents: read
  issues: read

jobs:
  check:
    name: Historical bindings (not current-run completion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Collect historical activation records (not run outputs)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { join } = require('node:path');
            const { collectHistoricalActivationRecords } = await import(pathToFileURL(
              join(process.env.GITHUB_WORKSPACE, '.github/workflows/shared/check-agent-binding.mjs')).href);
            const audit = await collectHistoricalActivationRecords({ github, context });
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/activation-comments.json`, JSON.stringify(audit));
      - name: Audit historical bindings without asserting current-run completion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node .github/workflows/shared/check-agent-binding.mjs
          --comments-file="$RUNNER_TEMP/activation-comments.json"
          --team-file=".squad/team.md"
          --repo="${{ github.repository }}"
