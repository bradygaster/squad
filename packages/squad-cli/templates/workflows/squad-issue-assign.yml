name: Squad Issue Assign

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  assign-work:
    # Only trigger on squad:{member} labels (not the base "squad" label)
    if: startsWith(github.event.label.name, 'squad:')
    runs-on: ubuntu-latest
    steps:
      - name: Require Copilot assignment token
        if: github.event.label.name == 'squad:copilot'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7
        env:
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        with:
          script: |
            if (!process.env.COPILOT_ASSIGN_TOKEN?.trim()) {
              throw new Error('COPILOT_ASSIGN_TOKEN is required for squad:copilot assignment; no routing or assignment attempted.');
            }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4

      - name: Identify assigned member and trigger work
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const label = context.payload.label.name;
            const slugify = value => value
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '');
            const findMemberBySlug = (lines, memberName) => {
              let inMembersTable = false;
              const matches = [];
              for (const line of lines) {
                if (line.match(/^##\s+(Members|Team Roster)/i)) {
                  inMembersTable = true;
                  continue;
                }
                if (inMembersTable && line.startsWith('## ')) break;
                if (inMembersTable && line.startsWith('|') && !line.includes('---') && !line.includes('Name')) {
                  const cells = line.split('|').map(c => c.trim()).filter(Boolean);
                  if (cells.length >= 2 && slugify(cells[0]) === memberName) {
                    matches.push({ name: cells[0], role: cells[1] });
                  }
                }
              }
              return {
                member: matches.length === 1 ? matches[0] : null,
                ambiguous: matches.length > 1,
              };
            };

            // Extract member name from label (e.g., "squad:ripley" → "ripley")
            const memberName = label.replace('squad:', '').toLowerCase();
            // Copilot is acknowledged only after the assignment API accepts it.
            if (memberName === 'copilot') return;

            const teamFile = '.squad/team.md';
            if (!fs.existsSync(teamFile)) {
              core.warning('No .squad/team.md found — cannot assign work');
              return;
            }

            const content = fs.readFileSync(teamFile, 'utf8');
            const lines = content.split('\n');

            const match = findMemberBySlug(lines, memberName);
            const assignedMember = match.member;
            if (match.ambiguous) {
              core.warning(`Multiple squad members map to label "${label}" — refusing ambiguous assignment`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `⚠️ Multiple squad members map to label \`${label}\`. Rename the colliding members in \`.squad/team.md\` before assigning work.`
              });
              return;
            }

            if (!assignedMember) {
              core.warning(`No member found matching label "${label}"`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `⚠️ No squad member found matching label \`${label}\`. Check \`.squad/team.md\` for valid member names.`
              });
              return;
            }

            // Post assignment acknowledgment
            const comment = [
                `### 📋 Assigned to ${assignedMember.name} (${assignedMember.role})`,
                '',
                `**Issue:** #${issue.number} — ${issue.title}`,
                '',
                `${assignedMember.name} will pick this up in the next Copilot session.`,
                '',
                `> **For Copilot coding agent:** If enabled, this issue will be worked automatically.`,
                `> Otherwise, start a Copilot session and say:`,
                `> \`${assignedMember.name}, work on issue #${issue.number}\``,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });

            core.info(`Issue #${issue.number} assigned to ${assignedMember.name} (${assignedMember.role})`);

      # Separate step: assign @copilot using PAT (required for coding agent)
      - name: Assign @copilot coding agent
        if: github.event.label.name == 'squad:copilot'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;

            // Get the default branch name (main, master, etc.)
            const { data: repoData } = await github.rest.repos.get({ owner, repo });
            const baseBranch = repoData.default_branch;

            const response = await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
                owner,
                repo,
                issue_number,
                assignees: ['copilot-swe-agent[bot]'],
                agent_assignment: {
                  target_repo: `${owner}/${repo}`,
                  base_branch: baseBranch,
                  custom_instructions: '',
                  custom_agent: '',
                  model: ''
                },
                headers: {
                  'X-GitHub-Api-Version': '2022-11-28'
                }
            });
            if (![200, 201].includes(response?.status) ||
                !Array.isArray(response?.data?.assignees) ||
                !response.data.assignees.some(assignee => assignee?.login === 'copilot-swe-agent[bot]')) {
              throw new Error(`Copilot assignment API did not confirm copilot-swe-agent[bot] for issue #${issue_number}; handoff is unverified.`);
            }
            core.info(`Copilot assignment API accepted issue #${issue_number} (base: ${baseBranch}); session creation is not verified.`);
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: [
                `### 🤖 Copilot assignment API accepted`,
                '',
                `**Issue:** #${issue_number} — ${context.payload.issue.title}`,
                `The API accepted the coding-agent request and returned \`copilot-swe-agent[bot]\` as an assignee (base: \`${baseBranch}\`).`,
                '',
                `This is not proof of a running session. Verify a Copilot session linked to this issue or a linked \`copilot/*\` draft PR before treating the handoff as started.`,
              ].join('\n')
            });
